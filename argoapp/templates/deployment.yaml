apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argoapp.fullname" . }}
  labels:
    app: {{ include "argoapp.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "argoapp.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "argoapp.name" . }}
    spec:
      containers:
        - name: {{ include "argoapp.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
